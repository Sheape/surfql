[package]
name = "surfql-downloader"
version = "0.1.0"
edition = "2024"

[dependencies]
amqprs = { version = "2.1.3", features = ["tokio-rustls", "urispec", "tls"] }
async-trait = "0.1.89"
azure_core = "0.30.1"
azure_identity = "0.30.0"
azure_storage_blob = "0.7.0"
clap = { version = "4.5.53", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["from", "display"] }
dotenv = "0.15.0"
futures = "0.3.31"
indicatif = "0.18.3"
rand = "0.9.2"
reqwest = { version = "0.13.1", features = ["json", "stream"] }
serde = "1.0.228"
serde_with = "3.16.1"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = "0.7.17"
tracing = "0.1.44"
typespec = "0.10.1"
