[package]
name = "surfql-downloader"
version = "0.1.0"
edition = "2024"

[dependencies]
azure_core = "0.30.1"
azure_identity = "0.30.0"
azure_storage_blob = "0.7.0"
derive_more = { version = "2.1.1", features = ["from", "display"] }
dotenv = "0.15.0"
futures = "0.3.31"
reqwest = { version = "0.12.28", features = ["json", "rustls-tls", "stream"], default-features = false }
serde = "1.0.228"
serde_with = "3.16.1"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.44"
typespec = "0.10.1"
