[package]
name = "surfql"
edition = "2024"
authors = ["Sheape <paulpare@protonmail.com>"]
homepage = "https://www.surfql.app"
license = "MIT"
rust-version = "1.92.0"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused = { level = "allow", priority = -1 }

[workspace]
members = [
    "crates/surfql-indexer",
    "crates/surfql-downloader",
    "crates/surfql-core",
    "crates/surfql-storage",
    "crates/surfql-queue"
, "crates/surfql-telemetry"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Sheape <paulpare@protonmail.com>"]

[workspace.dependencies]
async-trait = "0.1.89"
azure_core = "0.30.1"
azure_identity = "0.30.0"
azure_storage_blob = "0.7.0"
# dom-content-extraction = "0.3.15"
dotenv = "0.15.0"
futures = "0.3.31"
indicatif = "0.18.3"
rand = "0.9.2"
reqwest = { version = "0.13.1", features = ["json", "stream", "rustls-no-provider"], default-features = false }
# roaring = "0.11.3"
rust-stemmers = "1.2.0"
serde = "1.0.228"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = "0.7.17"
tracing = "0.1.44"
typespec = "0.10.1"
thiserror = "2.0.17"
unicode-segmentation = "1.12.0"

[dependencies]
surfql-downloader = { path = "crates/surfql-downloader" }
surfql-indexer = { path = "crates/surfql-indexer" }
surfql-telemetry = { path = "crates/surfql-telemetry" }
clap = { version = "4.5.53", features = ["derive"] }
tokio = { version = "1.48.0", features = ["full"] }
